[project]
name = "ProCompA"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "af3io>=26.0",
    "biopython>=1.87",
    "brokenaxes>=0.6.2",
    "dash>=4.4.1",
    "dash-molstar>=1.4.0",
    "dockq>=2.1.3",
    "duckdb>=1.5.5",
    "fastparquet>=2026.5.0",
    "gemmi>=0.7.5",
    "hmmer>=3.4.0.2",
    "ipykernel>=7.2.0",
    "lxml>=6.1.0",
    "marimo>=0.23.5",
    "matplotlib-venn>=1.1.2",
    "nglview>=4.0.1",
    "numpy>=1.26.4",
    "pandas>=3.0.3",
    "polars>=1.40.1",
    "pooled-ppi",
    "prody>=2.6.1",
    "py3dmol>=2.5.4",
    "pyarrow>=24.0.0",
    "pymol-open-source>=3.1.0a0",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "stoic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procompa"]

[tool.uv.sources]
stoic = { git = "https://github.com/PickyBinders/stoic.git" }
pooled-ppi = { git = "https://github.com/jurgjn/pooled-ppi", rev = "develop" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
